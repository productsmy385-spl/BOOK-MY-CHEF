spring:
  application:
    name: book-my-chef-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/book_my_chef}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      fail-on-empty-beans: false

clerk:
  issuer: ${CLERK_ISSUER:https://viable-marmot-48.clerk.accounts.dev}
  jwks-url: ${CLERK_JWKS_URL:https://viable-marmot-48.clerk.accounts.dev/.well-known/jwks.json}
  webhook-secret: ${CLERK_WEBHOOK_SECRET:whsec_default_secret}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_bookmychef123}
  key-secret: ${RAZORPAY_KEY_SECRET:test_secret_key_placeholder}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret_key}

marketplace:
  platform-commission-rate: 10.00
  customer-service-fee-rate: 3.50
  slot-lock-duration-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
