# All environment-specific values come from environment variables (see /.env.example).
# There are deliberately no fallback secrets: a missing integration reports itself as
# "not configured" instead of running with placeholder credentials.
spring:
  application:
    name: book-my-chef-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/book_my_chef}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      # Business dates/times (event dates, advance notice) are Indian local time.
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

clerk:
  issuer: ${CLERK_ISSUER:}
  jwks-url: ${CLERK_JWKS_URL:}
  # Comma-separated web origins allowed in the token's azp claim (empty = not checked)
  authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}
  secret-key: ${CLERK_SECRET_KEY:}
  api-url: ${CLERK_API_URL:https://api.clerk.com/v1}
  webhook-secret: ${CLERK_WEBHOOK_SECRET:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY:}
  private-key: ${IMAGEKIT_PRIVATE_KEY:}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}

app:
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,capacitor://localhost,https://localhost}
  # Verified emails that may claim the first SUPER_ADMIN account. Remove after setup.
  bootstrap-admin-emails: ${BOOTSTRAP_ADMIN_EMAILS:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
