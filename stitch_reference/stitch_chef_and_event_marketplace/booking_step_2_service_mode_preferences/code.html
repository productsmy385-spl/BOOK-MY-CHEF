  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex-1 flex flex-col items-center justify-center min-w-0"><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Menu Customization</h1><div aria-label="Booking progress" class="w-24 h-1 bg-surface-container-high rounded-full overflow-hidden mt-space-xs" role="progressbar"><div class="w-1/2 h-full bg-primary rounded-full"></div></div></div><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface flex-1"><div class="flex flex-col w-full pb-28">
<div class="flex flex-col gap-space-lg pt-space-sm">
<!-- Section 1: Select Service Delivery Mode -->
<section class="flex flex-col gap-space-sm">
<div class="flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Select Service Delivery Mode</h2>
<span class="font-label-sm text-label-sm text-primary bg-primary-fixed px-2.5 py-1 rounded-full">Step 2 of 5</span>
</div>
<div aria-label="Service Delivery Mode" class="flex flex-col gap-space-sm" id="delivery-modes" role="radiogroup">
<!-- Option 1: Selected -->
<button aria-checked="true" class="mode-card w-full text-left p-space-md rounded-2xl bg-primary-fixed text-on-primary-fixed shadow-md transition-all duration-200 flex items-start gap-space-md" data-mode="home" role="radio" type="button">
<div class="w-11 h-11 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">home_pin</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-space-xs">
<span class="font-title-md text-title-md text-on-primary-fixed truncate">Chef Visits My Home</span>
<span class="mode-check material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="font-body-sm text-body-sm text-on-primary-fixed-variant mt-1">Chef cooks fresh at your kitchen. Visiting fee + ingredients.</p>
</div>
</button>
<!-- Option 2 -->
<button aria-checked="false" class="mode-card w-full text-left p-space-md rounded-2xl bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-200 flex items-start gap-space-md" data-mode="deliver" role="radio" type="button">
<div class="w-11 h-11 rounded-full bg-surface-container-low text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">takeout_dining</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-space-xs">
<span class="font-title-md text-title-md text-on-surface truncate">Cook & Deliver</span>
<span class="mode-check material-symbols-outlined text-outline-variant text-[20px] opacity-0">check_circle</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Prepared at chef's kitchen and delivered hot in casseroles.</p>
</div>
</button>
<!-- Option 3 -->
<button aria-checked="false" class="mode-card w-full text-left p-space-md rounded-2xl bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-200 flex items-start gap-space-md" data-mode="venue" role="radio" type="button">
<div class="w-11 h-11 rounded-full bg-surface-container-low text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">celebration</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-space-xs">
<span class="font-title-md text-title-md text-on-surface truncate">Cook at Event Venue</span>
<span class="mode-check material-symbols-outlined text-outline-variant text-[20px] opacity-0">check_circle</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Ideal for banquet halls & outdoor gatherings.</p>
</div>
</button>
<!-- Option 4 -->
<button aria-checked="false" class="mode-card w-full text-left p-space-md rounded-2xl bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-200 flex items-start gap-space-md" data-mode="custom" role="radio" type="button">
<div class="w-11 h-11 rounded-full bg-surface-container-low text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">tune</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-space-xs">
<span class="font-title-md text-title-md text-on-surface truncate">Custom Arrangement</span>
<span class="mode-check material-symbols-outlined text-outline-variant text-[20px] opacity-0">check_circle</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Discuss custom kitchen & serving setup.</p>
</div>
</button>
</div>
</section>
<!-- Section 2: Food Preferences & Dietary Notes -->
<section class="flex flex-col gap-space-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Food Preferences & Dietary Notes</h2>
<div class="flex flex-wrap gap-space-sm" id="dietary-chips">
<button class="diet-chip h-9 px-3.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md flex items-center gap-1.5 shadow-sm transition-all duration-150" data-selected="true" type="button">
<span class="chip-icon material-symbols-outlined text-[16px]">check</span>
<span>Traditional Andhra</span>
</button>
<button class="diet-chip h-9 px-3.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 shadow-sm transition-all duration-150" data-selected="false" type="button">
<span class="chip-icon material-symbols-outlined text-[16px] hidden">check</span>
<span>Spicy</span>
</button>
<button class="diet-chip h-9 px-3.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 shadow-sm transition-all duration-150" data-selected="false" type="button">
<span class="chip-icon material-symbols-outlined text-[16px] hidden">check</span>
<span>Pure Veg option</span>
</button>
<button class="diet-chip h-9 px-3.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 shadow-sm transition-all duration-150" data-selected="false" type="button">
<span class="chip-icon material-symbols-outlined text-[16px] hidden">check</span>
<span>Jain-friendly</span>
</button>
<button class="diet-chip h-9 px-3.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 shadow-sm transition-all duration-150" data-selected="false" type="button">
<span class="chip-icon material-symbols-outlined text-[16px] hidden">check</span>
<span>Less Oil</span>
</button>
</div>
</section>
<!-- Section 3: Additional Dishes & Notes -->
<section class="flex flex-col gap-space-sm">
<label class="font-headline-sm text-headline-sm text-on-surface" for="dish-notes">Additional Dishes & Notes</label>
<div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm">
<textarea class="w-full bg-transparent text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none resize-none" id="dish-notes" placeholder="e.g., Please include Gongura Pachadi, Pootharekulu, and extra mirchi bajji..." rows="3"></textarea>
</div>
</section>
<!-- Section 4: Upload Reference Images -->
<section class="flex flex-col gap-space-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Upload Reference Images</h2>
<label class="relative w-full rounded-2xl bg-surface-container-low p-space-lg flex flex-col items-center justify-center gap-space-sm cursor-pointer hover:bg-surface-container transition-colors" for="ref-upload">
<svg aria-hidden="true" class="absolute inset-0 w-full h-full pointer-events-none rounded-2xl">
<rect class="text-primary/40" fill="none" height="calc(100% - 4px)" rx="16" ry="16" stroke="currentColor" stroke-dasharray="6 6" stroke-width="1.5" width="calc(100% - 4px)" x="2" y="2"></rect>
</svg>
<div class="w-12 h-12 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined">add_photo_alternate</span>
</div>
<span class="font-label-md text-label-md text-primary text-center" id="upload-label">Upload menu or dish reference photos</span>
<span class="font-body-sm text-body-sm text-on-surface-variant text-center">JPG, PNG up to 5MB each</span>
<input accept="image/*" class="hidden" id="ref-upload" multiple="" type="file"/>
</label>
</section>
</div>
<!-- Sticky Bottom CTA Bar -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl px-margin py-3 pb-safe shadow-[0_-4px_20px_rgba(13,71,161,0.06)]">
<button class="w-full h-12 rounded-full bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-space-xs shadow-md active:scale-[0.99] transition-transform" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" type="button">
<span>Review Summary</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function () {
    const modeCards = document.querySelectorAll('.mode-card');
    modeCards.forEach((card) => {
      card.addEventListener('click', () => {
        modeCards.forEach((c) => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-primary-fixed', 'text-on-primary-fixed', 'shadow-md');
          c.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
          const iconBox = c.querySelector('div:first-child');
          iconBox.classList.remove('bg-primary', 'text-on-primary');
          iconBox.classList.add('bg-surface-container-low', 'text-primary');
          const title = c.querySelector('span.font-title-md');
          title.classList.remove('text-on-primary-fixed');
          title.classList.add('text-on-surface');
          const desc = c.querySelector('p');
          desc.classList.remove('text-on-primary-fixed-variant');
          desc.classList.add('text-on-surface-variant');
          const check = c.querySelector('.mode-check');
          check.classList.add('opacity-0');
        });

        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
        card.classList.add('bg-primary-fixed', 'text-on-primary-fixed', 'shadow-md');
        const iconBox = card.querySelector('div:first-child');
        iconBox.classList.remove('bg-surface-container-low', 'text-primary');
        iconBox.classList.add('bg-primary', 'text-on-primary');
        const title = card.querySelector('span.font-title-md');
        title.classList.remove('text-on-surface');
        title.classList.add('text-on-primary-fixed');
        const desc = card.querySelector('p');
        desc.classList.remove('text-on-surface-variant');
        desc.classList.add('text-on-primary-fixed-variant');
        const check = card.querySelector('.mode-check');
        check.classList.remove('opacity-0');
      });
    });

    const dietChips = document.querySelectorAll('.diet-chip');
    dietChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const isSelected = chip.getAttribute('data-selected') === 'true';
        const icon = chip.querySelector('.chip-icon');
        if (isSelected) {
          chip.setAttribute('data-selected', 'false');
          chip.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
          chip.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
          icon.classList.add('hidden');
        } else {
          chip.setAttribute('data-selected', 'true');
          chip.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
          chip.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
          icon.classList.remove('hidden');
        }
      });
    });

    const uploadInput = document.getElementById('ref-upload');
    const uploadLabel = document.getElementById('upload-label');
    if (uploadInput && uploadLabel) {
      uploadInput.addEventListener('change', (e) => {
        const count = e.target.files ? e.target.files.length : 0;
        if (count > 0) {
          uploadLabel.textContent = count === 1 ? e.target.files[0].name : count + ' reference photos selected';
        }
      });
    }
  })();
</script></main></body></html>
