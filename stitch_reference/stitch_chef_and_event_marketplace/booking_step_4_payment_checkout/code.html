</button>

</div>

<span class="material-symbols-outlined text-transparent text-[14px]">check</span>
</div>

</div>

<div class="flex items-center justify-between">

<span class="font-label-md text-label-md text-on-surface">₹18,550</span>
</div>
<div class="flex items-center justify-between" id="remaining-row">
<span class="font-body-md text-body-md text-on-surface-variant">Remaining (Due after service)</span>
<span class="font-label-md text-label-md text-on-surface">₹12,985</span>
</div>
<div class="h-px bg-surface-container-high w-full my-0.5"></div>
<div class="flex items-center justify-between">
<span class="font-title-md text-title-md text-on-surface" id="summary-label">Advance Payable Today</span>
<span class="font-metric-price text-metric-price text-primary" id="summary-amount">₹5,565</span>
</div>
</div>
<div class="bg-surface-container-lowest text-on-surface-variant rounded-lg px-4 py-3 shadow-sm flex items-center justify-center gap-2 text-center">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-body-sm text-body-sm">Secured by Razorpay • 100% Refundable if provider declines</span>
</div>
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-md px-4 py-3 pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.06)]">
<button class="w-full h-12 rounded-full bg-primary text-on-primary font-title-md text-title-md shadow-md hover:bg-primary/90 active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="pay-cta-btn" type="button">
<span class="material-symbols-outlined text-[20px]">lock</span>
<span id="pay-cta-text">Pay ₹5,565 Now</span>
</button>
</div>
</div>
<script>
  (function () {
    const planCards = document.querySelectorAll('.plan-card');
    const methodCards = document.querySelectorAll('.method-card');
    const summaryLabel = document.getElementById('summary-label');
    const summaryAmount = document.getElementById('summary-amount');
    const remainingRow = document.getElementById('remaining-row');
    const payCtaText = document.getElementById('pay-cta-text');
    const payCtaBtn = document.getElementById('pay-cta-btn');

    planCards.forEach((card) => {
      card.addEventListener('click', () => {
        const isAdvance = card.dataset.plan === 'advance';
        const formattedAmount = isAdvance ? '₹5,565' : '₹18,550';

        planCards.forEach((c) => {
          const active = c === card;
          const radioOuter = c.querySelector('div > div:first-child');
          const radioInner = radioOuter.querySelector('div');

          if (active) {
            c.classList.remove('bg-surface-container-lowest', 'text-on-surface');
            c.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
            radioOuter.classList.remove('bg-surface-container-high');
            radioOuter.classList.add('bg-primary');
            radioInner.classList.remove('bg-transparent');
            radioInner.classList.add('bg-on-primary');
          } else {
            c.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
            c.classList.add('bg-surface-container-lowest', 'text-on-surface');
            radioOuter.classList.remove('bg-primary');
            radioOuter.classList.add('bg-surface-container-high');
            radioInner.classList.remove('bg-on-primary');
            radioInner.classList.add('bg-transparent');
          }
        });

        summaryLabel.textContent = isAdvance ? 'Advance Payable Today' : 'Total Payable Today';
        summaryAmount.textContent = formattedAmount;
        payCtaText.textContent = `Pay ${formattedAmount} Now`;
        remainingRow.style.display = isAdvance ? 'flex' : 'none';
      });
    });

    methodCards.forEach((card) => {
      card.addEventListener('click', () => {
        methodCards.forEach((c) => {
          const active = c === card;
          const iconBox = c.querySelector('div > div:first-child');
          const radio = c.querySelector('.method-radio');
          const checkIcon = radio.querySelector('span');

          if (active) {
            iconBox.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
            iconBox.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
            radio.classList.remove('bg-surface-container-high');
            radio.classList.add('bg-primary');
            checkIcon.classList.remove('text-transparent');
            checkIcon.classList.add('text-on-primary');
          } else {
            iconBox.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
            iconBox.classList.add('bg-surface-container-low', 'text-on-surface-variant');
            radio.classList.remove('bg-primary');
            radio.classList.add('bg-surface-container-high');
            checkIcon.classList.remove('text-on-primary');
            checkIcon.classList.add('text-transparent');
          }
        });
      });
    });

    payCtaBtn.addEventListener('click', () => {
      payCtaText.textContent = 'Opening Razorpay...';
      payCtaBtn.classList.add('opacity-90');
      setTimeout(() => {
        const activePlan = document.querySelector('.plan-card.bg-primary-fixed');
        const amount = activePlan && activePlan.dataset.plan === 'full' ? '₹18,550' : '₹5,565';
        payCtaText.textContent = `Pay ${amount} Now`;
        payCtaBtn.classList.remove('opacity-90');
      }, 1500);
    });
  })();
</script></main></body></html>
