name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx oxlint src e2e
      - run: npm run build

  e2e:
    name: End-to-end (API + browser)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: book_my_chef
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d book_my_chef"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/book_my_chef
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CLERK_ISSUER: http://localhost:9999
      CLERK_JWKS_URL: http://localhost:9999/.well-known/jwks.json
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_API_URL: http://localhost:9999/v1
      BOOTSTRAP_ADMIN_EMAILS: user_admin1@example.test
      CORS_ALLOWED_ORIGINS: http://localhost:5179
      APP_RATE_LIMIT_AUTH_PER_MINUTE: '5000'
      APP_RATE_LIMIT_WRITE_PER_MINUTE: '5000'
      APP_RATE_LIMIT_SEARCH_PER_MINUTE: '5000'
      PORT: '8081'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build backend
        working-directory: apps/backend
        run: chmod +x mvnw && ./mvnw -B -q package -DskipTests

      - name: Install web dependencies and browser
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium

      - name: Start fake Clerk, backend and web app
        working-directory: apps/web
        run: |
          nohup node e2e/support/fake-clerk.mjs > /tmp/clerk.log 2>&1 &
          nohup java -jar ../backend/target/book-my-chef-backend-1.0.0.jar > /tmp/backend.log 2>&1 &
          API_PROXY_TARGET=http://localhost:8081 VITE_API_BASE_URL=/api/v1 VITE_CLERK_PUBLISHABLE_KEY=none \
            nohup npx vite --port 5179 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8081/actuator/health >/dev/null && curl -sf http://localhost:5179 >/dev/null && exit 0
            sleep 2
          done
          echo "Services did not start"; tail -50 /tmp/backend.log; exit 1

      - name: API scenarios
        working-directory: apps/web
        run: npm run test:api

      - name: Browser tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Service logs
        if: failure()
        run: tail -n 100 /tmp/backend.log /tmp/vite.log /tmp/clerk.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
