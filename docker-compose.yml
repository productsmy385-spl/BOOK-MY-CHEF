version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: book_my_chef_postgres
    environment:
      POSTGRES_DB: book_my_chef
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_my_chef"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: book_my_chef_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/book_my_chef
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
